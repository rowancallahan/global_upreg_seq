[project]
name = "global_upreg_seq"
version = "0.1.0"
description = "differential gene expression under global upregulation"
authors = [
    {name = "Rowan Callahan",email = "rowan.l.callahan@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pyro-ppl>=1.8.0",
    "pandas (>=2.3.0,<3.0.0)",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "jupyterlab (>=4.4.6,<5.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
manuscript = [
    "pydeseq2>=0.5.2",
]


