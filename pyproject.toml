[project]
name = "glorb-seq"
version = "1.1.1"
readme = "README.md"
description = "differential gene expression under global upregulation"
authors = [
    {name = "Rowan Callahan",email = "rowan.l.callahan@gmail.com"}
]
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "numpyro==0.20.0",
    "jax==0.9.1",
    "optax>=0.2.7",
    "numpy"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "torch>=2.0.0",
    "pyro-ppl>=1.8.0",
    "pandas>=2.3.0,<3.0.0",
    "scikit-learn (>=1.7.1,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "ipykernel (>=6.30.1,<7.0.0)",
    "jupyterlab (>=4.4.6,<5.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)"
]
manuscript = [
    "pydeseq2>=0.5.2",
]

[project.urls]
Repository = "https://github.com/rowancallahan/GLORB-seq"
Paper = "https://doi.org/10.64898/2026.08.28.747928"
